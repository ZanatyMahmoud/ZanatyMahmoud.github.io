<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Portfolio responsive QA</title><style>body{margin:0;background:#ddd;color:#171a17;font:14px Arial}header{padding:10px;display:flex;gap:8px;flex-wrap:wrap;background:#ddd;z-index:2}button{padding:8px;cursor:pointer}iframe{display:block;border:0;height:700px;background:white;margin:0 auto;transform-origin:top center}#readout{white-space:pre-wrap;padding:10px;margin:0;max-height:70px;overflow:auto}#frame-wrap{overflow:auto}button:focus-visible{outline:3px solid #333}</style></head><body><header><button data-width="360">360px</button><button data-width="390">390px</button><button data-width="768">768px</button><button data-width="1440">1440px</button><button id="ar">Arabic</button><button id="en">English</button><button id="reference">Reference</button><button id="nojs">Disable JavaScript</button><button id="refresh">Inspect layout</button></header><p id="readout" role="status"></p><div id="frame-wrap"><iframe id="site" title="Portfolio preview" width="390" src="../index.html"></iframe></div><script>
const frame=document.getElementById('site');const output=document.getElementById('readout');let disabled=false;
function inspect(){try{const d=frame.contentDocument;const w=frame.contentWindow;const overflow=[...d.querySelectorAll('body *')].filter(e=>{const r=e.getBoundingClientRect();return e.checkVisibility()&&r.width>0&&(r.right>w.innerWidth+1||r.left< -1)&&!e.classList.contains('skip')});output.textContent=JSON.stringify({viewport:w.innerWidth,documentWidth:d.documentElement.scrollWidth,lang:d.documentElement.lang,dir:d.documentElement.dir,overflow:overflow.map(e=>e.tagName+'.'+e.className),title:d.title,printButton:!d.querySelector('.print-button').hidden,images:[...d.images].map(i=>({src:i.getAttribute('src'),loaded:i.complete&&i.naturalWidth>0}))},null,2)}catch(e){output.textContent='Cross-origin sandbox prevents document inspection; inspect the rendered page.'}}
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{frame.width=b.dataset.width;frame.style.transform=Number(b.dataset.width)>1200?'scale(.85)':'none';requestAnimationFrame(inspect)});
document.getElementById('reference').onclick=()=>frame.src='https://raedibrahim.art/';
document.getElementById('ar').onclick=()=>frame.src='../index.html';document.getElementById('en').onclick=()=>frame.src='../en.html';document.getElementById('refresh').onclick=inspect;
document.getElementById('nojs').onclick=()=>{disabled=!disabled;if(disabled)frame.setAttribute('sandbox','allow-same-origin');else frame.removeAttribute('sandbox');frame.src=frame.src;document.getElementById('nojs').textContent=disabled?'Enable JavaScript':'Disable JavaScript'};frame.onload=inspect;
</script></body></html>
